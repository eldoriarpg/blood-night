name: Verify

on:
  # Branches with a pull request are verified by it alone; a push run beside it would report every check twice.
  # Renovate branches carry no pull request when they are merged automatically, so a push is what verifies them.
  push:
    branches: [main, 'renovate/**']
    tags: ['v*']
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

env:
  JAVA_VERSION: 25

jobs:
  verify-format:
    runs-on: ubuntu-latest
    name: Verify Formatting
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting and license headers
        run: ./gradlew spotlessCheck

  verify-nulls:
    runs-on: ubuntu-latest
    name: Verify Null Use
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check null use
        run: ./gradlew spotbugsMain
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-reports
          path: '*/build/reports/spotbugs/'

  verify-tests:
    runs-on: ubuntu-latest
    name: Verify Tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run the tests
        run: ./gradlew test
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'

  verify-build:
    runs-on: ubuntu-latest
    name: Verify Build
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build the plugin
        run: ./gradlew assemble
      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: plugin/core/build/libs/BloodNight-*.jar

  verify-frontend:
    runs-on: ubuntu-latest
    name: Verify Frontend
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run the tests
        run: npx vitest run
      - name: Lint, type check and build
        run: node scripts/build.mjs
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run the end-to-end stories
        run: |
          NITRO_PORT=4000 node .output/server/index.mjs &
          npx playwright test
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: web/frontend/e2e/report

  verify-docs:
    runs-on: ubuntu-latest
    name: Verify Documentation
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build the node catalog and the plugin descriptor
        run: ./gradlew :catalog:generateCatalog :core:generatePaperPluginDescription
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Check the reference pages
        working-directory: docs
        run: node scripts/generate.mjs --check
      - name: Build the site
        working-directory: docs
        run: npm run build
