"t:feature":
  - head-branch: "^feature/"
"t:fix":
  - head-branch: "^fix/"
"t:deps":
  - head-branch: "^renovate/"
"t:chore":
  - head-branch: "^chore/"
"t:other":
  - head-branch: "^(?!feature/|fix/|renovate/|chore/).*$"

"a:api":
  - changed-files:
      - any-glob-to-any-file:
          - "plugin/api/src/main/**"
"a:graph":
  - changed-files:
      - any-glob-to-any-file:
          - "graph/model/src/main/**"
          - "graph/compiler/src/main/**"
          - "graph/std/src/main/**"
"a:nodes":
  - changed-files:
      - any-glob-to-any-file:
          - "plugin/bukkit-nodes/src/main/**"
"a:core":
  - changed-files:
      - any-glob-to-any-file:
          - "plugin/core/src/main/**"
          - "plugin/resourcepack/**"
"a:editor":
  - changed-files:
      - any-glob-to-any-file:
          - "graph/editor-payload/**"
          - "plugin/catalog/**"
          - "web/**"
          - ".docker/**"
"a:build":
  - changed-files:
      - any-glob-to-any-file:
          - "buildSrc/**"
          - "gradle/**"
          - "config/**"
          - "*.gradle.kts"
"a:tests":
  - changed-files:
      - any-glob-to-any-file:
          - "*/src/test/**"
"a:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "CONTRIBUTING.md"
          - "docs/**"
"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
