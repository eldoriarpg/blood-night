services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/eldoriarpg/bloodnight-backend:${BLOODNIGHT_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EDITOR_URL: ${EDITOR_ADDRESS:?set EDITOR_ADDRESS in .env}/session/{id}#{token}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.1,::1}
    volumes:
      - assets:/var/cache/bloodnight/assets
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/eldoriarpg/bloodnight-frontend:${BLOODNIGHT_VERSION:-latest}
    restart: unless-stopped
    environment:
      NUXT_BACKEND_URL: http://backend:8080
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      - backend

volumes:
  postgres:
  assets:
