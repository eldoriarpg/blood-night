services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  editor-service:
    build:
      context: ..
      dockerfile: .docker/editor-service.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      EDITOR_URL: ${EDITOR_URL:-http://localhost:3000/session/{id}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
