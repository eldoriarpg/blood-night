[versions]
javalin = "7.2.3"
sadu = "2.3.9"
logback = "1.6.3"
testcontainers = "2.0.5"
run-paper = "3.1.0"
plugin-yml = "0.9.0"
strokkcommands = "2.3.1"
jackson = "3.2.3"
jackson-bukkit = "2.0.0"
ocular = "2.3.0"
eldoutil = "2.0.1"
paper = "26.2.build.133-stable"
jetbrains-annotations = "26.1.0"
junit = "6.1.3"
mockbukkit = "4.117.0"
placeholderapi = "2.12.3"
miniplaceholders = "3.2.0"
worldguard = "7.0.19"
ecj = "3.46.100"
javapoet = "0.20.0"
shadow = "9.6.1"
javaparser = "3.28.2"
spotless = "8.10.4"
spotbugs = "6.5.12"
spotbugs-annotations = "4.10.4"
jspecify = "1.0.1"
palantir = "2.84.0"

[libraries]
strokkcommands-annotations = { module = "net.strokkur.commands:annotations-paper", version.ref = "strokkcommands" }
strokkcommands-processor = { module = "net.strokkur.commands:processor-paper", version.ref = "strokkcommands" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jackson-bukkit-paper = { module = "de.eldoria.jacksonbukkit:paper", version.ref = "jackson-bukkit" }
ocular = { module = "dev.chojo:ocular", version.ref = "ocular" }

eldoutil-items = { module = "de.eldoria.util:items", version.ref = "eldoutil" }
eldoutil-entities = { module = "de.eldoria.util:entities", version.ref = "eldoutil" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
miniplaceholders = { module = "io.github.miniplaceholders:miniplaceholders-api", version.ref = "miniplaceholders" }
worldguard = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
ecj = { module = "org.eclipse.jdt:ecj", version.ref = "ecj" }
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
javaparser = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }

javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
sadu-postgresql = { module = "de.chojo.sadu:sadu-postgresql", version.ref = "sadu" }
sadu-datasource = { module = "de.chojo.sadu:sadu-datasource", version.ref = "sadu" }
sadu-queries = { module = "de.chojo.sadu:sadu-queries", version.ref = "sadu" }
sadu-mapper = { module = "de.chojo.sadu:sadu-mapper", version.ref = "sadu" }
sadu-updater = { module = "de.chojo.sadu:sadu-updater", version.ref = "sadu" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.13" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

[bundles]
sadu = ["sadu-postgresql", "sadu-datasource", "sadu-queries", "sadu-mapper", "sadu-updater"]
jackson-lite = ["jackson-core", "jackson-databind", "jackson-annotations"]
jackson-full = ["jackson-core", "jackson-databind", "jackson-annotations", "jackson-yaml"]
eldoria-utilities = ["eldoutil-items", "eldoutil-entities"]
junit = ["junit-jupiter", "junit-params"]

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
plugin-yml-paper = { id = "de.eldoria.plugin-yml.paper", version.ref = "plugin-yml" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
