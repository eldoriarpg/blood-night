bloodnight.intro.title=A Blood Night
bloodnight.intro.danger=<red>The sky turns red, and the monsters grow strong.</red> Some of them are special: they leap at you, throw fire, or carry you off into the sky.
bloodnight.intro.help=Find shelter and light up the area around you. Stay close to your friends. Good armor keeps your heart calm.
bloodnight.intro.reward=Special mobs drop rewards. With some luck you find enchantments that only blood nights bring.
bloodnight.intro.end=The night does not last forever. Survive until it ends.
bloodnight.intro.ready=I'm ready
