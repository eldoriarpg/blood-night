# Built-in particle effects, read only. Their ids get "bloodnight:" in front, e.g. bloodnight:blood_aura.
# Copy one in the web editor's Particles tab to change it.
effects:
  blood_aura:
    name: Blood aura
    duration: 40
    emitters:
      - particle: minecraft:dust
        data: {color: "#8a0303", size: 1.2}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.1, z: 0}
        shape: {type: RING, radius: 0.8, points: 14, spin: 9}
        every: 3
      - particle: minecraft:dust_color_transition
        data: {color: "#c00000", to: "#200000", size: 0.8}
        anchor: {at: CENTER}
        count: 2
        spread: {x: 0.35, y: 0.6, z: 0.35}
        every: 4
  toxic_haze:
    name: Toxic haze
    duration: 40
    emitters:
      - particle: minecraft:dust
        data: {color: "#3c9a1e", size: 1.6}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.3, z: 0}
        count: 3
        spread: {x: 0.6, y: 0.2, z: 0.6}
        every: 4
      - particle: minecraft:sneeze
        anchor: {at: CENTER}
        spread: {x: 0.4, y: 0.4, z: 0.4}
        speed: 0.01
        every: 10
        chance: 0.5
  void_shimmer:
    name: Void shimmer
    duration: 40
    emitters:
      - particle: minecraft:dust
        data: {color: "#7a1fa2", size: 0.9}
        anchor: {at: FEET}
        shape: {type: SPIRAL, radius: 0.6, height: 2.2, turns: 1.5, points: 10, strands: 2, spin: 12}
        every: 4
      - particle: minecraft:reverse_portal
        anchor: {at: CENTER}
        spread: {x: 0.4, y: 0.8, z: 0.4}
        count: 2
        speed: 0.02
        every: 5
  ember_crown:
    name: Ember crown
    duration: 40
    emitters:
      - particle: minecraft:small_flame
        anchor: {at: ABOVE}
        shape: {type: RING, radius: 0.35, points: 8, spin: 15}
        every: 3
      - particle: minecraft:flame
        anchor: {at: CENTER}
        spread: {x: 0.3, y: 0.5, z: 0.3}
        speed: 0.01
        every: 8
        chance: 0.6
  storm_charge:
    name: Storm charge
    duration: 40
    emitters:
      - particle: minecraft:electric_spark
        anchor: {at: CENTER}
        shape: {type: SPHERE, radius: 0.9, points: 12}
        every: 3
        chance: 0.4
  soul_mist:
    name: Soul mist
    duration: 40
    emitters:
      - particle: minecraft:soul
        anchor: {at: FEET}
        shape: {type: SPIRAL, radius: 0.7, height: 2, turns: 1, points: 6, spin: 20}
        every: 8
        chance: 0.7
      - particle: minecraft:smoke
        anchor: {at: FEET}
        offset: {x: 0, y: 0.2, z: 0}
        count: 2
        spread: {x: 0.4, y: 0.1, z: 0.4}
        every: 5
  tide_drip:
    name: Tide drip
    duration: 40
    emitters:
      - particle: minecraft:dripping_water
        anchor: {at: EYES}
        shape: {type: RING, radius: 0.4, points: 6, spin: 30}
        every: 6
      - particle: minecraft:bubble_pop
        anchor: {at: CENTER}
        spread: {x: 0.4, y: 0.6, z: 0.4}
        every: 8
  spore_cloud:
    name: Spore cloud
    duration: 40
    emitters:
      - particle: minecraft:crimson_spore
        anchor: {at: CENTER}
        count: 3
        spread: {x: 0.7, y: 0.8, z: 0.7}
        every: 5
      - particle: minecraft:spore_blossom_air
        anchor: {at: ABOVE}
        spread: {x: 0.5, y: 0.3, z: 0.5}
        every: 10
  fuse_glow:
    name: Fuse glow
    duration: 40
    emitters:
      - particle: minecraft:dust
        data: {color: "#ff8a1c", size: 1}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.15, z: 0}
        shape: {type: RING, radius: 0.7, points: 12, spin: -10}
        every: 4
      - particle: minecraft:small_flame
        anchor: {at: CENTER}
        spread: {x: 0.3, y: 0.4, z: 0.3}
        every: 10
  teleport_puff:
    name: Teleport puff
    duration: 6
    emitters:
      - particle: minecraft:portal
        anchor: {at: CENTER}
        shape: {type: SPHERE, radius: 0.8, points: 32}
        speed: 0.3
        every: 3
  heal_burst:
    name: Heal burst
    duration: 10
    emitters:
      - particle: minecraft:heart
        anchor: {at: ABOVE}
        shape: {type: RING, radius: 0.5, points: 6}
        every: 10
      - particle: minecraft:happy_villager
        anchor: {at: CENTER}
        shape: {type: SPHERE, radius: 0.9, points: 20}
        every: 5
  shock_wave:
    name: Shock wave
    duration: 10
    emitters:
      - particle: minecraft:dust
        data: {color: "#f2f2f2", size: 1.4}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.1, z: 0}
        shape: {type: RING, radius: 3, points: 32, grow: true}
        every: 2
  night_end_smoke:
    name: Night end smoke
    duration: 20
    emitters:
      - particle: minecraft:campfire_cosy_smoke
        anchor: {at: FEET}
        shape: {type: SPIRAL, radius: 0.5, height: 2, turns: 1, points: 8}
        speed: 0.02
        every: 10
  spawn_rise:
    name: Spawn rise
    duration: 16
    emitters:
      - particle: minecraft:soul
        anchor: {at: FEET}
        shape: {type: RING, radius: 0.8, points: 10, spin: 18}
        speed: 0.05
        every: 4
  death_burst:
    name: Death burst
    duration: 2
    emitters:
      - particle: minecraft:block_crumble
        data: {block: minecraft:redstone_block}
        anchor: {at: CENTER}
        count: 12
        spread: {x: 0.3, y: 0.4, z: 0.3}
      - particle: minecraft:dust
        data: {color: "#8a0303", size: 1.3}
        anchor: {at: CENTER}
        shape: {type: SPHERE, radius: 0.7, points: 24}
  speed_trail:
    name: Speed trail
    duration: 20
    emitters:
      - particle: minecraft:cloud
        anchor: {at: FEET}
        spread: {x: 0.2, y: 0.05, z: 0.2}
        every: 4
        chance: 0.7
      - particle: minecraft:dust
        data: {color: "#d8d8d8", size: 0.6}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.2, z: -0.4}
        count: 2
        spread: {x: 0.2, y: 0.1, z: 0.2}
        every: 3
  dread_shadow:
    name: Dread shadow
    duration: 40
    emitters:
      - particle: minecraft:dust
        data: {color: "#120012", size: 1.4}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.1, z: 0}
        count: 3
        spread: {x: 0.5, y: 0.05, z: 0.5}
        every: 4
      - particle: minecraft:witch
        anchor: {at: EYES}
        spread: {x: 0.3, y: 0.2, z: 0.3}
        every: 10
        chance: 0.5
  arcane_glow:
    name: Arcane glow
    duration: 40
    emitters:
      - particle: minecraft:enchant
        anchor: {at: CENTER}
        shape: {type: SPHERE, radius: 0.8, points: 10}
        speed: 0.3
        every: 5
      - particle: minecraft:dust
        data: {color: "#a050ff", size: 0.7}
        anchor: {at: ABOVE}
        shape: {type: RING, radius: 0.3, points: 6, spin: 20}
        every: 4
  shadow_wings:
    name: Shadow wings
    duration: 60
    self: false
    emitters:
      - particle: minecraft:dust
        data: {color: "#1a0010", size: 0.9}
        anchor: {at: CENTER, on: TARGET}
        offset: {x: 0, y: 0.3, z: -0.35}
        shape:
          type: PATTERN
          facing: BODY
          scale: 0.12
          mirror: true
          flap: {degrees: 25, ticks: 16}
          rows:
            - "......xx"
            - "....xxxx"
            - "..xxxxx."
            - "xxxxxx.."
            - ".xxxx..."
            - "..xx...."
        every: 2
        tiles: 2
  arcane_lines:
    name: Arcane lines
    duration: 20
    emitters:
      - particle: minecraft:enchant
        anchor: {at: EYES}
        shape: {type: ARC, density: 3, bend: 0.8, twist: 60, spin: 12}
        every: 2
        tiles: 4
      - particle: minecraft:dust
        data: {color: "#a050ff", size: 0.7}
        anchor: {at: EYES}
        shape: {type: ARC, density: 4, bend: 0.8, twist: -60, spin: 12}
        every: 2
        tiles: 4
  arcane_seal:
    name: Arcane seal
    duration: 160
    viewDistance: 128
    emitters:
      - particle: minecraft:dust
        data: {color: "#8a0303", size: 1.8}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.1, z: 0}
        shape: {type: RING, radius: 24, points: 256, spin: 1, facing: UP}
        every: 4
        tiles: 4
      - particle: minecraft:dust_color_transition
        data: {color: "#b000ff", to: "#300050", size: 1.3}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.15, z: 0}
        shape: {type: RING, radius: 22, points: 200, spin: -1.5, facing: UP}
        every: 4
        tiles: 4
        delay: 20
      - particle: minecraft:dust
        data: {color: "#ff2040", size: 1.5}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.2, z: 0}
        shape:
          type: PATTERN
          facing: UP
          scale: 1.4
          spin: 0.5
          grow: true
          rows:
            - "...............x..............."
            - "..............xxx.............."
            - "..............x.x.............."
            - ".............xx.xx............."
            - ".............x...x............."
            - "............x..x..x............"
            - "............x.xxx.x............"
            - "...........x...x...x..........."
            - "..xxxxxxxxxxxxxxxxxxxxxxxxxxx.."
            - "...x...x..x.........x..x...x..."
            - "...xx.xxxxx.........xxxxx.xx..."
            - "....x..x.x...........x.x..x...."
            - ".....x..x.............x..x....."
            - ".....xx.x.............x.xx....."
            - "......xx...............xx......"
            - "......xx...............xx......"
            - "......xx...............xx......"
            - ".....xx.x.............x.xx....."
            - ".....x..x.............x..x....."
            - "....x..x.x...........x.x..x...."
            - "...xx.xxxxx.........xxxxx.xx..."
            - "...x...x..x.........x..x...x..."
            - "..xxxxxxxxxxxxxxxxxxxxxxxxxxx.."
            - "...........x...x...x..........."
            - "............x.xxx.x............"
            - "............x..x..x............"
            - ".............x...x............."
            - ".............xx.xx............."
            - "..............x.x.............."
            - "..............xxx.............."
            - "...............x..............."
        every: 4
        tiles: 3
        delay: 40
      - particle: minecraft:enchant
        anchor: {at: FEET}
        offset: {x: 0, y: 0.6, z: 0}
        shape: {type: RING, radius: 12, points: 120, spin: 3, facing: UP}
        every: 4
        tiles: 2
        delay: 70
      - particle: minecraft:end_rod
        anchor: {at: FEET}
        offset: {x: 0, y: 0.3, z: 0}
        shape: {type: RING, radius: 8, points: 64, spin: -4, facing: UP}
        every: 8
        tiles: 2
        delay: 90
      - particle: minecraft:reverse_portal
        anchor: {at: FEET}
        shape: {type: SPIRAL, radius: 3, height: 14, turns: 3, points: 48, strands: 3, spin: 10, facing: UP}
        every: 4
        tiles: 3
        delay: 110
      - particle: minecraft:dust
        data: {color: "#ff0000", size: 1.1}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.25, z: 0}
        shape: {type: RING, radius: 24, points: 256, spin: -2, facing: UP}
        spread: {x: 0.3, y: 0.1, z: 0.3}
        every: 2
        tiles: 8
        delay: 125
      - particle: minecraft:explosion
        anchor: {at: FEET}
        offset: {x: 0, y: 1, z: 0}
        shape: {type: RING, radius: 26, points: 48, facing: UP}
        every: 2
        delay: 156
  drain_beam:
    name: Drain beam
    duration: 60
    emitters:
      - particle: minecraft:trail
        data: {color: "#ff1010", ticks: 16}
        anchor: {at: CENTER, on: TARGET, aim: EYES}
        shape: {type: SPHERE, radius: 0.5, points: 4}
        every: 1
      - particle: minecraft:trail
        data: {color: "#8a0000", ticks: 10}
        anchor: {at: CENTER, on: TARGET, aim: EYES}
        shape: {type: BEAM, density: 1, jitter: 0.15}
        every: 2
        chance: 0.7
      - particle: minecraft:dust_color_transition
        data: {color: "#ff0000", to: "#300000", size: 0.8}
        anchor: {at: CENTER, on: TARGET}
        shape: {type: RING, radius: 0.6, points: 12, spin: 15, facing: PATH}
        every: 2
  lightning_bolt:
    name: Lightning bolt
    duration: 8
    emitters:
      - particle: minecraft:electric_spark
        anchor: {at: FEET}
        offset: {x: 0, y: 12, z: 0}
        shape: {type: BEAM, to: {x: 0, y: -12, z: 0}, density: 3, jitter: 0.35}
        every: 2
      - particle: minecraft:dust
        data: {color: "#e8f0ff", size: 1.2}
        anchor: {at: FEET}
        offset: {x: 0, y: 12, z: 0}
        shape: {type: BEAM, to: {x: 0, y: -12, z: 0}, density: 2, jitter: 0.25}
        every: 2
  blood_spear:
    name: Blood spear
    duration: 40
    pieces:
      - kind: BLOCK
        block: minecraft:end_rod
        scale: 2
        rotation: {pitch: 90, yaw: 0, roll: 0}
        anchor: {at: EYES, aim: CENTER}
        motion: {ticks: 8, through: 1.5, ease: IN}
        stick: 20
        glow: true
        color: "#b00000"
    emitters:
      - particle: minecraft:dust
        data: {color: "#8a0303", size: 0.7}
        anchor: {on: PIECE, piece: 0}
        count: 2
        spread: {x: 0.05, y: 0.05, z: 0.05}
        every: 1
      - particle: minecraft:block_crumble
        data: {block: minecraft:redstone_block}
        anchor: {at: CENTER, on: TARGET}
        shape: {type: SPHERE, radius: 0.4, points: 12}
        delay: 8
        every: 40
  rune_circle:
    name: Rune circle
    duration: 20
    emitters:
      - particle: minecraft:dust
        data: {color: "#9b30ff", size: 0.8}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.05, z: 0}
        shape: {type: RING, radius: 1.3, points: 24, spin: 6}
        every: 2
      - particle: minecraft:dust
        data: {color: "#d080ff", size: 0.7}
        anchor: {at: FEET}
        offset: {x: 0, y: 0.06, z: 0}
        shape:
          type: PATTERN
          facing: UP
          scale: 0.22
          spin: 6
          rows:
            - "...x..."
            - "..x.x.."
            - ".x...x."
            - "x..x..x"
            - ".x...x."
            - "..x.x.."
            - "...x..."
        every: 2
